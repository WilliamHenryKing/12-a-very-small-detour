<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="A VERY SMALL DETOUR: Turn the map's pieces until the miniature terrain opens a route.">
<title>A VERY SMALL DETOUR</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a281f"/><stop offset="1" stop-color="#2d4433"/></linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.45" r="0.55"><stop offset="0" stop-color="#d9543f" stop-opacity="0.42"/><stop offset="1" stop-color="#d9543f" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#d9543f" stop-opacity="0"/><stop offset="0.5" stop-color="#d9543f" stop-opacity="0.18"/><stop offset="1" stop-color="#d9543f" stop-opacity="0"/></linearGradient>
</defs>
<style>
.t{font-family:Georgia, 'Times New Roman', serif;font-weight:700;fill:#f5efe0;letter-spacing:-0.01em;animation:rise 1.1s ease-out both}
.e{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700;font-size:17px;letter-spacing:0.28em;fill:#d9543f;animation:rise 0.9s ease-out both}
.g{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;fill:#f5efe0;opacity:0.82;animation:rise 1.3s ease-out 0.45s both}
.u{animation:grow 1.4s ease-out 0.6s both;transform-origin:72px 0}
.glow{animation:breathe 7s ease-in-out infinite;transform-origin:1000px 160px}
.p{animation:drift linear infinite}
.ring{transform-origin:1010px 180px;animation:spin linear infinite}
.wave{animation:slide linear infinite}
.scan{animation:sweep 6s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes drift{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{to{transform:translateX(-160px)}}
@keyframes sweep{to{transform:translateX(1520px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="360" fill="url(#bg)"/>
<rect class="glow" width="1280" height="360" fill="url(#glow)"/>
<g opacity="0.5"><path d="M0 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M64 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M128 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M192 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M256 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M320 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M384 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M448 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M512 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M576 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M640 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M704 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M768 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M832 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M896 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M960 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M1024 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M1088 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M1152 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M1216 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M1280 0V360" stroke="#e9dfc4" stroke-width="0.6"/><path d="M0 0H1280" stroke="#e9dfc4" stroke-width="0.6"/><path d="M0 64H1280" stroke="#e9dfc4" stroke-width="0.6"/><path d="M0 128H1280" stroke="#e9dfc4" stroke-width="0.6"/><path d="M0 192H1280" stroke="#e9dfc4" stroke-width="0.6"/><path d="M0 256H1280" stroke="#e9dfc4" stroke-width="0.6"/><path d="M0 320H1280" stroke="#e9dfc4" stroke-width="0.6"/></g><rect class="scan" x="-240" y="0" width="240" height="360" fill="url(#scan)"/>
<text x="72" y="93.9" class="e">A HINGED POCKET-MAP PUZZLE</text>
<text x="72" y="168" font-size="78" class="t" style="animation-delay:0.15s">A VERY SMALL</text><text x="72" y="244.44" font-size="78" class="t" style="animation-delay:0.35s">DETOUR</text>
<rect class="u" x="72" y="266.44" width="488" height="3" fill="#d9543f"/>
<text x="72" y="302.44" class="g">Turn the map's pieces until the miniature terrain opens a route.</text>
</svg>
