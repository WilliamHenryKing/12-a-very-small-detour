<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A VERY SMALL DETOUR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Rearrange a pocket map's hinged terrain to make a walkable route" />
    <style>
      /* Arrival veil: a survey sheet's contours while the relief model is set out. Lifted by worldReady() in src/loader.ts. */
      html, body { margin: 0; background: #1a2327; }
      #arrival { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 16px; color: #f2ead6; font: 600 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; text-align: center; background: repeating-radial-gradient(ellipse at 38% 46%, #0000 0 26px, #d4ad5518 26px 27px, #0000 27px 52px, #d4ad550c 52px 53px), repeating-radial-gradient(ellipse at 70% 64%, #0000 0 34px, #f2ead60d 34px 35px), #1a2327; transition: opacity 0.6s ease, visibility 0.6s; }
      #arrival.is-done { opacity: 0; visibility: hidden; }
      #arrival small { display: block; margin-top: 6px; font-weight: 500; font-size: 11px; letter-spacing: 0.12em; text-transform: none; color: #f2ead6aa; }
      #arrival .bar { width: 150px; height: 3px; overflow: hidden; background: repeating-linear-gradient(90deg, #d8402a66 0 8px, #0000 8px 13px); }
      #arrival .bar i { display: block; height: 100%; width: 40%; background: repeating-linear-gradient(90deg, #ff6b45 0 8px, #0000 8px 13px); animation: arrival-slide 1.4s ease-in-out infinite; }
      @keyframes arrival-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #arrival .bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="arrival" role="status" aria-live="polite"><span>A Very Small Detour<small>Setting out the relief of Little Nothing Fell…</small></span><div class="bar"><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
